# ==============================================================================
# Sinsemoji Window Manager & Desktop Environment Shortcuts Reference
# (Lilith Linux Distro Edition)
# ==============================================================================

# --- COSMIC Desktop ---
# In ~/.config/cosmic/com.system76.CosmicSettings.Shortcuts/v1/custom:
# (modifiers: [Ctrl], key: "e", description: Some("Sinsemoji")): Spawn("sinsemoji"),
# (modifiers: [Alt], key: "e", description: Some("Sinsemoji (Alt fallback)")): Spawn("sinsemoji"),

# --- Hyprland (~/.config/hypr/hyprland.conf) ---
# bind = CONTROL, E, exec, sinsemoji
# bind = ALT, E, exec, sinsemoji

# --- Sway (~/.config/sway/config) ---
# bindsym Ctrl+e exec sinsemoji
# bindsym Mod1+e exec sinsemoji

# --- i3 (~/.config/i3/config) ---
# bindsym Control+e exec --no-startup-id sinsemoji
# bindsym Mod1+e exec --no-startup-id sinsemoji

# --- sxhkd (X11) (~/.config/sxhkd/sxhkdrc) ---
# ctrl + e
#     sinsemoji
# alt + e
#     sinsemoji

# --- KDE Plasma (Custom Shortcuts / KGlobalAccel) ---
# Command URL: sinsemoji
# Shortcut: Ctrl+E or Alt+E
