# ==============================================================================
# Simplemoji Window Manager & Desktop Environment Shortcuts Reference
# ==============================================================================

# --- COSMIC Desktop ---
# In ~/.config/cosmic/com.system76.CosmicSettings.Shortcuts/v1/custom:
# (modifiers: [Ctrl], key: "e", description: Some("Simplemoji")): Spawn("simplemoji-picker"),
# (modifiers: [Alt], key: "e", description: Some("Simplemoji (Alt fallback)")): Spawn("simplemoji-picker"),

# --- Hyprland (~/.config/hypr/hyprland.conf) ---
# bind = CONTROL, E, exec, simplemoji-picker
# bind = ALT, E, exec, simplemoji-picker

# --- Sway (~/.config/sway/config) ---
# bindsym Ctrl+e exec simplemoji-picker
# bindsym Mod1+e exec simplemoji-picker

# --- i3 (~/.config/i3/config) ---
# bindsym Control+e exec --no-startup-id simplemoji-picker
# bindsym Mod1+e exec --no-startup-id simplemoji-picker

# --- sxhkd (X11) (~/.config/sxhkd/sxhkdrc) ---
# ctrl + e
#     simplemoji-picker
# alt + e
#     simplemoji-picker

# --- KDE Plasma (Custom Shortcuts / KGlobalAccel) ---
# Command URL: simplemoji-picker
# Shortcut: Ctrl+E or Alt+E
